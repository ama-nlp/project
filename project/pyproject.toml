[project]
name = "project"
version = "0.1.0"
description = "Big Brother is (Maybe) Watching - belief-conditioned CoT obfuscation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.0",
    "orjson>=3.11",
    "tqdm>=4.66",
    "fire>=0.7",
    "python-dotenv>=1.0",
    "polars>=1.31",
]

[project.scripts]
project = "project.cli:main"

[dependency-groups]
# Installed only on the Ada compute/login nodes. Keep off any laptop.
# No vLLM: it is not available on Ada, so transformers is the production path.
# accelerate provides device_map="auto" sharding across the 11 GB cards.
gpu = [
    # torch 2.6.0 is the LAST release with manylinux1 x86_64 wheels (glibc 2.5).
    # 2.7.0 moved to manylinux_2_28, needing glibc 2.28. Ada cannot use those:
    # the login node is CentOS 7 (glibc 2.17) and the compute nodes are Ubuntu
    # 18.04 (glibc 2.27). Do not bump this without checking `ldd --version`.
    "torch>=2.6,<2.7",
    # transformers 5.x renamed from_pretrained's `torch_dtype` to `dtype`,
    # which is what backends.py passes. It needs only torch>=2.5, so it does
    # not drag torch forward.
    "transformers>=5.0,<6",
    "accelerate>=1.1",
    "huggingface-hub[hf-transfer]>=0.26",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
# vendor/ is copied verbatim from ariahw/rl-rewardhacking so that upstream
# fixes stay easy to pull in. Do not lint or reformat it.
extend-exclude = ["src/project/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv]
# The system Python here is 3.14, which torch/vLLM do not support. Pin a
# managed 3.12 so `uv run` behaves identically on a laptop and on Ada.
python-preference = "managed"
python-downloads = "automatic"
