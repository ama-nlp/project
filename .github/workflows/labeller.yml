# Test, render and deploy the human-labelling page (labeller/) to Cloudflare Pages.
# Runs on pushes to main that touch the labeller, and on demand. Needs two repository
# secrets: CLOUDFLARE_API_TOKEN (a token with "Cloudflare Pages: Edit") and
# CLOUDFLARE_ACCOUNT_ID.
name: labeller

on:
  push:
    branches: [main]
    paths:
      - labeller/**
      - project/scripts/make_human_label_site.py
      - project/scripts/render_label_site.py
      - project/scripts/score_human_labels.py
      - project/tests/test_human_label_site.py
      - project/tests/test_score_human_labels.py
      - .github/workflows/labeller.yml
  workflow_dispatch:

concurrency:
  group: labeller-deploy
  cancel-in-progress: false

env:
  PAGES_PROJECT: reasoning-labeller

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --group dev

      - name: Test
        run: uv run pytest -q tests/test_human_label_site.py tests/test_score_human_labels.py

      - name: Render page from committed blinded data
        run: uv run python scripts/render_label_site.py --out ../dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Cloudflare Pages
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          npx -y wrangler@4 pages project list | grep -q "$PAGES_PROJECT" ||
            npx -y wrangler@4 pages project create "$PAGES_PROJECT" --production-branch main
          npx -y wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_SHA::7}"
          echo "Live at https://$PAGES_PROJECT.pages.dev" >> "$GITHUB_STEP_SUMMARY"
